<style>
/* navegação: cabeçalho fixo da página de vendas, botão voltar e foco entre páginas */
#app .stop{position:sticky;top:0;z-index:30;margin-inline:-16px;padding:6px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.brandbtn{background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;min-height:44px}
.snav{display:flex;gap:2px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav button{border:0;background:none;color:var(--muted);font:600 13px var(--body);min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.snav button:hover,.snav button[aria-current="true"]{background:var(--soft);color:var(--ink)}
.sact{display:flex;gap:8px;align-items:center}
@media (max-width:760px){#app .stop{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}#app .snav{grid-column:1/-1;order:3;justify-content:flex-start}}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;padding:0;color:var(--ink);font:600 14px var(--body);cursor:pointer}
.backbtn svg{transform:rotate(180deg)}
#app:focus{outline:none}
.snav button:focus-visible,.backbtn:focus-visible,.brandbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: coluna de app (até 520px). Cartão-herói azul com o número da semana em itálico largo; a semana vira uma "pista" de 10 marcos; cada treino é um cartão com a faixa de corrida/caminhada; navegação em pílula flutuante. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#0E1530; --muted:#69718C; --line:#E4E7EE;
  --hero:#121B3E; --hero-ink:#FFFFFF; --hero-muted:#A9B1D1; --hero-line:rgba(255,255,255,.12);
  --accent:#85F25E; --on-accent:#0E1530; --accent-ink:#2C7413; --walk:#DCE0EA; --soft:#EEF0F5;
  --danger:#B3261E; --logo-filter:brightness(0); --shadow:0 1px 2px rgba(14,21,48,.04),0 8px 24px rgba(14,21,48,.06);
  --display:'Archivo','Arial Narrow',sans-serif; --body:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F24; --surface:#121935; --ink:#F2F4FA; --muted:#98A0BF; --line:#232B4D;
  --hero:#151E45; --hero-ink:#FFFFFF; --hero-muted:#A9B1D1; --hero-line:rgba(255,255,255,.1);
  --accent:#85F25E; --on-accent:#0E1530; --accent-ink:#9BF57A; --walk:#2A3358; --soft:#19214A;
  --danger:#FF9A93; --logo-filter:none; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F24; --surface:#121935; --ink:#F2F4FA; --muted:#98A0BF; --line:#232B4D;
  --hero:#151E45; --hero-ink:#FFFFFF; --hero-muted:#A9B1D1; --hero-line:rgba(255,255,255,.1);
  --accent:#85F25E; --on-accent:#0E1530; --accent-ink:#9BF57A; --walk:#2A3358; --soft:#19214A;
  --danger:#FF9A93; --logo-filter:none; --shadow:none; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p,dl,dd{margin:0}
.disp{font-family:var(--display);font-style:italic;font-weight:800;font-stretch:118%;text-transform:uppercase;line-height:.92;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}
svg.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:26px;width:auto;filter:var(--logo-filter)}
.brand .sep{width:1px;height:18px;background:var(--line)}
.brand span{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0 14px;font-size:14px;font-weight:500}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:0 20px;min-height:52px;font-weight:600;font-size:16px;cursor:pointer;transition:transform .15s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--accent);color:var(--on-accent)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:52px;box-sizing:border-box;width:100%;transition:border-color .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.note{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted);display:flex;gap:10px}
.err{color:var(--danger);font-size:14px;font-weight:600}

/* herói com linhas de velocidade */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:18px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-20% -40% -20% 30%;z-index:-1;background:repeating-linear-gradient(-62deg,transparent 0 22px,rgba(133,242,94,.09) 22px 24px);animation:drift 14s linear infinite}
.hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(133,242,94,.22),transparent 65%)}
@keyframes drift{to{transform:translateX(-52px)}}
.hero .label{color:var(--hero-muted)}
.hero .disp{font-size:clamp(64px,21vw,104px)}
.hero .disp em{font-style:inherit;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hero-line);padding-top:16px;gap:8px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--hero-muted)}

/* pista das semanas */
.track{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.wk{position:relative;flex:1 0 44px;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-weight:600;font-size:15px}
.wk .pip{width:16px;height:3px;border-radius:2px;background:var(--walk)}
.wk.full .pip{background:var(--accent)}
.wk.part .pip{background:linear-gradient(90deg,var(--accent) 50%,var(--walk) 50%)}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk.locked{color:var(--muted);background:transparent;border-style:dashed}
.wk.locked svg{width:14px;height:14px}

/* cartões de treino */
.legend{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:18px;height:6px;border-radius:3px}
.sw.r,.bar .r{background:var(--accent)} .sw.w,.bar .w{background:var(--walk)}
.session{display:flex;flex-direction:column;gap:16px}
.session.done{border-color:var(--accent)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shead .disp{font-size:34px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:13px;font-weight:600;background:var(--soft);white-space:nowrap}
.chip.ok{background:var(--accent);color:var(--on-accent);font-family:var(--body)}
.bar{display:flex;gap:3px;height:10px}
.bar i{display:block;border-radius:5px;min-width:0;transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(.2);opacity:.4}}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:14px;align-items:start;padding-block:10px;position:relative}
.step::before{content:"";position:absolute;left:6px;top:24px;bottom:-10px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--walk);box-sizing:border-box;margin-top:4px;background:var(--surface)}
.step.main .dot{background:var(--accent);border-color:var(--accent)}
.step p{font-size:15px}
.step.main p{font-weight:600;font-size:16px}
.step .t{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px;white-space:nowrap}
.pace{display:flex;gap:12px;align-items:center;font-weight:500;padding:16px 18px;border-radius:18px;background:var(--soft)}
.pace svg{color:var(--accent-ink)}

/* navegação flutuante */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav div{pointer-events:auto;max-width:440px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(14,21,48,.12)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;border-radius:22px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* feed */
.post{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.av.me{background:var(--accent);color:var(--on-accent)}
.post .who{font-weight:600}
.post .what{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--muted)}
.post .c{margin-top:10px;background:var(--soft);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:15px}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-left:6px;vertical-align:2px}

/* ranking */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pod{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;min-width:0}
.pod.p1{background:var(--hero);color:var(--hero-ink);border-color:var(--hero);padding-block:22px}
.pod .disp{font-size:36px}
.pod.p1 .disp{color:var(--accent);font-size:44px}
.pod .n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .mono{font-size:13px;opacity:.75}
.rank{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.rank .pos{font-family:var(--mono);font-weight:600;color:var(--muted)}
.rank .pts{font-family:var(--mono);font-weight:600}
.rank.me{background:var(--soft);border-radius:14px;border-bottom-color:transparent;padding-inline:12px}

/* admin */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--soft);overflow-x:auto}
.seg button{flex:1 0 auto;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.st i{width:8px;height:8px;border-radius:50%;background:var(--walk)}
.st.on i{background:var(--accent)}

/* login */
.login-hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:28px 22px 26px;display:flex;flex-direction:column;gap:56px;isolation:isolate}
.login-hero::before{content:"";position:absolute;inset:-20% -40% -20% 10%;z-index:-1;background:repeating-linear-gradient(-62deg,transparent 0 22px,rgba(133,242,94,.1) 22px 24px);animation:drift 14s linear infinite}
.login-hero img{height:30px;width:auto;align-self:flex-start}
.login-hero .disp{font-size:clamp(58px,18vw,92px)}
.login-hero .disp em{font-style:inherit;color:var(--accent)}
.login-hero p{color:var(--hero-muted);max-width:30ch}
ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
ul.list li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px}
ul.list svg{color:var(--accent-ink);margin-top:2px}

/* foto do treino */
.attach{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border:1.5px dashed var(--muted);border-radius:14px;background:transparent;color:var(--ink);font-weight:600;cursor:pointer}
.thumb{position:relative;border-radius:14px;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;max-height:280px;object-fit:cover;display:block}
.thumb .iconbtn{position:absolute;top:8px;right:8px;padding:0;background:var(--surface)}
.pimg{margin-top:10px;width:100%;max-height:380px;object-fit:cover;border-radius:14px;display:block}
.compose{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,15,36,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
.sheet{width:100%;max-width:520px;box-sizing:border-box;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
.sheet .grabber{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin-bottom:6px}
.sheet h2{font-size:17px;font-weight:600;padding:0 4px 4px}
.opt{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 16px;border-radius:16px;background:var(--soft);font-weight:600;cursor:pointer}
.opt .key{background:var(--surface)}
.opt:focus-within{outline:2px solid var(--accent-ink);outline-offset:2px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}

/* câmera (visual próprio, sempre escuro) */
.cam{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;animation:fade .2s ease both}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video.mirror{transform:scaleX(-1)}
.cam-top{position:relative;display:flex;justify-content:flex-end;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.cam-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:28px 24px calc(30px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.cbtn{width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cbtn svg{width:24px;height:24px}
.cbtn.spin svg{animation:spin .4s ease}
@keyframes spin{from{transform:rotate(-180deg)}}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:#85F25E;box-shadow:inset 0 0 0 4px #000;cursor:pointer}
.shutter:active{transform:scale(.94)}
.cam-ph{width:56px}
.cam-fb{position:relative;margin:auto;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;max-width:320px}
.cam-fb p{color:#C9CFE6}
[hidden]{display:none!important}
.cam :focus-visible{outline:2px solid #85F25E;outline-offset:3px}

/* reações e comentários */
.react{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.rx{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px;transition:transform .12s}
.rx:active{transform:scale(.94)}
.rx b{font-family:var(--mono);font-weight:600;font-size:13px}
.rx .lbl{font-weight:600;font-size:13px}
.rx .e{width:28px;height:28px;display:block;transition:transform .15s}
.rx:has(.e){padding:0 8px 0 3px;gap:3px}
.rx:has(.e):not(:has(b)){padding:0 4px}
.rx.on .e{transform:scale(1.12)}
.rx svg{width:16px;height:16px}
.rx.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rx.open{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cmts{margin-top:12px;display:flex;flex-direction:column;gap:10px;padding-left:12px;border-left:2px solid var(--line)}
.cm{font-size:14px;line-height:1.45}
.cm .who{font-weight:600;margin-right:4px}
.cm .when{color:var(--muted);font-size:12px;margin-left:6px}
.cm button{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0 0 0 6px;min-height:24px}
.cbox{display:flex;gap:8px;margin-top:12px}
.cbox input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--surface)}
.cbox input:focus{outline:none;border-color:var(--ink)}
.send{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* página de vendas */
#app.wide{max-width:1080px}
.stop{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px}
.slogo{height:28px;width:auto;filter:var(--logo-filter)}
.shero{position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:var(--hero-ink);border-radius:30px;padding:clamp(24px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:center}
.shero::before{content:"";position:absolute;inset:-20% -40% -20% 20%;z-index:-1;background:repeating-linear-gradient(-62deg,transparent 0 22px,rgba(133,242,94,.09) 22px 24px);animation:drift 14s linear infinite}

function posts(adm){return S.feed.filter(function(p){return adm||!p.hidden;}).map(function(p){return {id:p.id,uid:p.uid,who:p.handle?'@'+p.handle:(p.name||'Aluno'),me:p.uid===S.uid,w:p.w,d:p.d,t:p.at,c:p.comment||'',ph:p.imgURL||'',photoURL:p.photoURL||'',rc:p.rc||{},hidden:!!p.hidden};});}
function weekIdx(t){return LetzCore.weekIndex(S.start,t);}
function pointedSet(){var o={};LetzCore.pointedKeys(S.marks,S.start).forEach(function(k){o[k]=1;});return o;}
function myPoints(){return S.points||0;}
function pointedThisWeek(){var w=weekIdx(Date.now()),c=0;for(var k in S.marks)if(weekIdx(S.marks[k])===w)c++;return Math.min(c,3);}
function totalDone(){return Object.keys(S.marks).length;}
function projectEnded(){return Date.now()>=S.start+10*WEEK;}
function myWeek(){for(var w=1;w<=10;w++)if(doneIn(w)<3)return w;return 10;}
function ranking(){var rows=S.rank.map(function(u){return {who:u.handle?'@'+u.handle:(u.name||'Aluno'),me:u.uid===S.uid,n:u.done||0,pts:u.points||0};});
  var pos=0,last=null;rows.forEach(function(r,i){if(r.pts!==last){pos=i+1;last=r.pts;}r.pos=pos;});return rows;}

function header(sub){return '<div class="top"><div class="brand"><img src="'+LOGO+'" alt="Letz"><i class="sep"></i><span>'+sub+'</span></div><div class="row" style="gap:8px;flex-wrap:nowrap">'+(V.view==='athlete'?'<button class="avbtn'+(S.photo?'':' me')+'" data-act="to-profile" aria-label="Editar perfil">'+(S.photo?'<img src="'+S.photo+'" alt="">':esc(initials(S.name||S.handle||'?')))+'</button>':'')+(role==='admin'?'<button class="iconbtn" data-act="'+(V.view==='admin'?'admin-athlete':'to-admin')+'">'+(V.view==='admin'?'Ver como atleta':'Painel')+'</button>':'')+'<button class="iconbtn" data-act="logout" aria-label="Sair">'+ic('out')+'</button></div></div>';}

function backBtn(label,to){return '<div class="top"><button class="backbtn" data-act="back" data-to="'+to+'">'+ic('arrow')+label+'</button></div>';}
function vLogin(){return (STANDALONE?'':backBtn('Conheça o projeto','sales'))+'<section class="login-hero"><img src="'+LOGO+'" alt="Letz"><div class="stack"><h1 class="disp">Do 0<br>aos <em>5 km</em></h1><p>10 semanas, três treinos por semana, no ritmo de quem está começando.</p></div></section>'+
 '<form id="f-login" class="stack" novalidate>'+
 '<div class="field"><label for="in-email">E-mail</label><input id="in-email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="voce@exemplo.com" value="'+esc(V.lemail||'')+'"></div>'+
 '<div class="field"><label for="in-pass">Senha</label><input id="in-pass" type="password" autocomplete="current-password" placeholder="Sua senha"></div>'+
 (V.err?'<p class="err" role="alert">'+esc(V.err)+'</p>':'')+
 '<button class="btn go wide" type="submit"'+(V.busy?' disabled':'')+'>'+(V.busy?'Entrando…':'Entrar '+ic('arrow'))+'</button></form>'+
 '<button class="linkbtn" data-act="to-forgot">Esqueci minha senha</button><button class="linkbtn" data-act="to-signup">Criar conta</button>'+
 (STANDALONE?'':'<button class="linkbtn" data-act="to-install">Como instalar o app no celular</button>')+'<button class="linkbtn" data-act="to-sales">Ainda não comprou? Conheça o projeto</button>';}

 sec('1. Quem é responsável pelos seus dados','<p>O Do 0 aos 5 km é um projeto da Letz Assessoria de Corrida, conduzido por Erik Martins e Uriel Pessoa, que decidem como seus dados são usados. Para qualquer assunto sobre seus dados, inclusive pedidos com base na LGPD, use o canal '+MAIL+'.</p>')+
 sec('2. Quais dados coletamos',ul(['<b>Dados da compra:</b> nome, e-mail, CPF e celular informados no cadastro e a situação do pedido (aprovado, reembolsado).','<b>Acesso:</b> e-mail e senha da sua conta e o registro de quando você entrou.','<b>Perfil:</b> nome, @ e, se você quiser, uma foto.','<b>Uso do app:</b> treinos marcados, pontos, comentários, fotos de treino e reações que você publica.','<b>Entrega da medalha:</b> nome de quem recebe, endereço com CEP e, se você informar, celular.','<b>Pagamentos:</b> a compra do projeto é processada pelo Asaas (Pix e cartão) e o frete por Pix. Recebemos apenas a confirmação do pagamento; não guardamos dados de cartão nem dados bancários.'])+

 sec('3. Para que usamos e com qual base legal',ul(['<b>Liberar e manter seu acesso, mostrar seus treinos e enviar a medalha:</b> para cumprir o contrato da compra (LGPD, art. 7º, V).','<b>Publicar sua foto, seus comentários e suas fotos de treino no feed:</b> com o seu consentimento, que você dá ao publicar e pode retirar apagando o conteúdo (art. 7º, I).','<b>Tirar dúvidas, acompanhar seu progresso e falar com você sobre o projeto:</b> por legítimo interesse, sempre ligado ao serviço que você contratou (art. 7º, IX).','<b>Guardar registros de compra e pagamento:</b> para cumprir obrigações legais e fiscais (art. 7º, II).']))+
 sec('4. O que a turma vê','<p>Seu @, sua foto de perfil, os treinos que você marca, sua posição no ranking, seus comentários, suas fotos de treino e suas reações ficam visíveis para os outros alunos do projeto. Seu e-mail, seu endereço e seu celular nunca aparecem no app para a turma.</p><p>No grupo de WhatsApp da turma, os outros participantes veem o seu número de telefone e o nome do seu perfil no WhatsApp, como em qualquer grupo. Entrar no grupo é opcional.</p>')+

 sec('6. Por quanto tempo guardamos',ul(['<b>Conta, treinos e publicações:</b> enquanto você tiver acesso ao app, ou até você pedir a exclusão.','<b>Endereço de entrega:</b> até a medalha ser entregue e por mais 90 dias, para resolver problemas com o envio.','<b>Registros de compra e pagamento:</b> pelo prazo exigido pela legislação fiscal.']))+
 sec('7. Como protegemos','<p>O acesso ao app é feito com e-mail e senha, a conexão é criptografada (https) e só os professores acessam a área administrativa. Nenhum sistema é totalmente imune a falhas. Se acontecer um incidente que possa trazer risco a você, avisamos você e a Autoridade Nacional de Proteção de Dados (ANPD), como determina a lei.</p>')+

var cam={el:null,stream:null,facing:'environment',key:null};
function camStop(){if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop();});cam.stream=null;}}
function camClose(){camStop();if(cam.el){cam.el.remove();cam.el=null;}}
function camFallback(){if(!cam.el)return;cam.el.querySelector('.cam-bar').hidden=true;cam.el.querySelector('.cam-fb').hidden=false;}
function camStart(){camStop();var v=cam.el.querySelector('video');
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){camFallback();return;}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cam.facing},width:{ideal:1280}},audio:false}).then(function(st){if(!cam.el){st.getTracks().forEach(function(t){t.stop();});return;}cam.stream=st;v.srcObject=st;v.classList.toggle('mirror',cam.facing==='user');var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});}).catch(function(){camFallback();});}
function camDone(d){var key=cam.key;camClose();if(d){V.pending[key]=d;V.cerr[key]='';}else V.cerr[key]='Não deu para abrir essa imagem. Tente outra.';var y=window.scrollY;render();window.scrollTo(0,y);}
function camOpen(key){camClose();cam.key=key;cam.facing='environment';var el=document.createElement('div');el.className='cam';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Câmera');
 el.innerHTML='<video playsinline autoplay muted></video><div class="cam-top"><button class="cbtn" data-c="close" aria-label="Fechar câmera">'+ic('x')+'</button></div>'+
  '<div class="cam-fb" hidden><p>Não deu para abrir a câmera por aqui. Use a câmera do celular.</p><label class="btn go" for="ph-cam2">'+ic('camera')+'Abrir câmera do celular<input class="sr" id="ph-cam2" type="file" accept="image/*" capture="environment"></label></div>'+
  '<div class="cam-bar"><span class="cam-ph"></span><button class="shutter" data-c="shot" aria-label="Tirar foto"></button><button class="cbtn" data-c="flip" aria-label="Virar câmera">'+ic('flip')+'</button></div>';
 el.addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;var c=b.getAttribute('data-c');
  if(c==='close')camClose();
  else if(c==='flip'){cam.facing=cam.facing==='user'?'environment':'user';b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');camStart();}
  else if(c==='shot'){var v=el.querySelector('video');if(!v.videoWidth)return;var sc=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),cv=document.createElement('canvas');cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);var x=cv.getContext('2d');if(cam.facing==='user'){x.translate(cv.width,0);x.scale(-1,1);}x.drawImage(v,0,0,cv.width,cv.height);camDone(cv.toDataURL('image/jpeg',.8));}});
 el.addEventListener('change',function(e){if(e.target.id==='ph-cam2')resizeImg(e.target.files&&e.target.files[0],900,camDone);});
 el.addEventListener('keydown',function(e){if(e.key==='Escape')camClose();});
 document.body.appendChild(el);cam.el=el;el.querySelector('[data-c=close]').focus();camStart();}

var NEEDS_SESSION=['admin','athlete','profile','welcome','aguardando','confirmando','bloqueado'];

 if(first==='app'){view='athlete';V.tab=TABS.indexOf(seg[1])>-1?seg[1]:'treinos';if(V.tab==='fim'&&!concluded())V.tab='treinos';}
 else if(first==='admin'){view='admin';V.atab=ATABS.indexOf(seg[1])>-1?seg[1]:'turma';}
 else if(first===''){view=STANDALONE?'login':'sales';}
 else for(k in ROUTES)if(ROUTES[k]==='/'+first)view=k;
 if(!view)view=STANDALONE?'login':'sales';

var stops=[],cmSubs={},rxLoading={},dataRole='';
function softRender(){if(V.view!=='athlete'&&V.view!=='admin')return;var y=window.scrollY,ae=document.activeElement,id=ae&&ae.id,ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){}

  ['av','wa','grupo'].forEach(function(k){if(k in c)cf[k]=c[k]||'';});if(Number(c.frete)>0)cf.frete=Number(c.frete);var px=c.pix||{};['chave','pnome','pcidade'].forEach(function(k){cf[k]=px[k]||'';});}

  if(role==='athlete'&&!S.myr[p.id]&&!rxLoading[p.id]){rxLoading[p.id]=1;need.push(p.id);}});
